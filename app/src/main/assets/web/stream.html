
    <!DOCTYPE html>
    <html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Down Free Stream - {fn}</title>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                padding: 20px;
                color: white;
            }

            .stream-container {
                background: rgba(255, 255, 255, 0.1);
                backdrop-filter: blur(20px);
                border-radius: 20px;
                padding: 30px;
                box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
                border: 1px solid rgba(255, 255, 255, 0.2);
                max-width: 900px;
                width: 100%;
                text-align: center;
            }

            .video-title {
                font-size: 1.5rem;
                font-weight: 600;
                margin-bottom: 20px;
                color: #ffffff;
                text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
                word-break: break-word;
            }

            .video-wrapper {
                position: relative;
                border-radius: 15px;
                overflow: hidden;
                box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
                margin-bottom: 30px;
            }

            video {
                width: 100%;
                height: auto;
                display: block;
                background: #000;
            }

            .controls-overlay {
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                background: linear-gradient(180deg, rgba(0,0,0,0.7) 0%, transparent 100%);
                padding: 15px;
                opacity: 0;
                transition: opacity 0.3s ease;
            }

            .video-wrapper:hover .controls-overlay {
                opacity: 1;
            }

            .file-info {
                color: white;
                font-size: 0.9rem;
                font-weight: 500;
            }

            .navigation-links {
                display: flex;
                gap: 15px;
                justify-content: center;
                flex-wrap: wrap;
            }

            .nav-link {
                display: inline-flex;
                align-items: center;
                gap: 8px;
                padding: 12px 24px;
                background: rgba(255, 255, 255, 0.15);
                color: white;
                text-decoration: none;
                border-radius: 50px;
                font-weight: 500;
                font-size: 0.9rem;
                transition: all 0.3s ease;
                border: 1px solid rgba(255, 255, 255, 0.2);
                backdrop-filter: blur(10px);
            }

            .nav-link:hover {
                background: rgba(255, 255, 255, 0.25);
                transform: translateY(-2px);
                box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
            }

            .nav-link:active {
                transform: translateY(0);
            }

            .icon {
                width: 16px;
                height: 16px;
                fill: currentColor;
            }

            @media (max-width: 768px) {
                .stream-container {
                    padding: 20px;
                    margin: 10px;
                }

                .video-title {
                    font-size: 1.2rem;
                }

                .navigation-links {
                    flex-direction: column;
                    align-items: center;
                }

                .nav-link {
                    width: 100%;
                    max-width: 200px;
                    justify-content: center;
                }
            }

            @media (max-width: 480px) {
                body {
                    padding: 10px;
                }

                .stream-container {
                    padding: 15px;
                }

                .video-title {
                    font-size: 1.1rem;
                    margin-bottom: 15px;
                }
            }
        </style>
    </head>
    <body>
        <div class="stream-container">
            <h1 class="video-title">{fn}</h1>

            <div class="video-wrapper">
                <video controls autoplay loop preload="metadata">
                    <source src="/stream/{token}?raw=1" type="{content_type}">
                    Tu navegador no soporta la reproducción de video.
                </video>
                <div class="controls-overlay">
                    <div class="file-info">🎬 {fn}</div>
                </div>
            </div>

            <div class="navigation-links">
                <a href="/" class="nav-link">
                    <svg class="icon" viewBox="0 0 24 24">
                        <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
                    </svg>
                    Inicio
                </a>
                <a href="/generate" class="nav-link">
                    <svg class="icon" viewBox="0 0 24 24">
                        <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
                    </svg>
                    Generar Enlaces
                </a>
                <a href="/settings" class="nav-link">
                    <svg class="icon" viewBox="0 0 24 24">
                        <path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.74,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.82,11.69,4.82,12s0.02,0.64,0.07,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/>
                    </svg>
                    Configuración
                </a>
            </div>
        </div>
    </body>
    </html>
