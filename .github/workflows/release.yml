name: Build and Release Android App

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Keystore
        env:
          ENCODED_KEY: ${{ secrets.KEY }}
        run: |
          echo "${ENCODED_KEY}" | tr -d '\r\n ' | base64 -d > app/release.keystore

      - name: Build Release APK
        env:
          KEYSTORE_FILE: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare APK Artifact
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          cp app/build/outputs/apk/release/app-release.apk "DownFree-${TAG_NAME}.apk"

      - name: Resolve Target Repository
        id: target_repo
        env:
          INPUT_REPO: ${{ secrets.REPO }}
        run: |
          if [ -z "$INPUT_REPO" ]; then
            echo "repo=${{ github.repository }}" >> $GITHUB_OUTPUT
          elif [[ "$INPUT_REPO" == *"/"* ]]; then
            echo "repo=${INPUT_REPO}" >> $GITHUB_OUTPUT
          else
            echo "repo=${{ github.repository_owner }}/${INPUT_REPO}" >> $GITHUB_OUTPUT
          fi

      - name: Sync Code to Target Repository
        env:
          TARGET_REPO: ${{ steps.target_repo.outputs.repo }}
          TOKEN: ${{ secrets.TOKEN }}
        run: |
          if [ "$TARGET_REPO" != "${{ github.repository }}" ] && [ -n "$TOKEN" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git remote add target "https://${TOKEN}@github.com/${TARGET_REPO}.git" || git remote set-url target "https://${TOKEN}@github.com/${TARGET_REPO}.git"
            git push target HEAD:main --force
            git push target "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}" --force
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Down Free ${{ github.ref_name }}
          body: |
            ## Down Free ${{ github.ref_name }}
            
            🎉 Nueva versión oficial lista para descargar.
          files: DownFree-${{ github.ref_name }}.apk
          repository: ${{ steps.target_repo.outputs.repo }}
          token: ${{ secrets.TOKEN || secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN || secrets.GITHUB_TOKEN }}

      - name: Clean up Workspace and Keystore
        if: always()
        run: |
          rm -f app/release.keystore
          rm -f "DownFree-${GITHUB_REF_NAME}.apk"
          rm -rf app/build
